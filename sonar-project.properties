# SonarQube Cloud analysis. Run by .github/workflows/ci.yml, which calls the shared
# workflow at gortazar/aideas/.github/workflows/sonar.yml@v1 — see
# https://github.com/gortazar/aideas/blob/main/ideas/quality-gate/README.md
sonar.projectKey=gortazar_lo-pert
sonar.organization=gortazar
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# spikes/ is where a design was tried out and abandoned. It is kept because the reasoning
# is worth reading, but it is not code this project maintains.
sonar.exclusions=spikes/**

# Written by the coverage job in ci.yml and handed to the scan as an artifact. The unit
# suite only: tests/integration drives a headless LibreOffice over the UNO bridge, and the
# code it exercises runs inside soffice's own interpreter, where coverage cannot see it.
sonar.python.coverage.reportPaths=coverage.xml

# The four UNO-facing modules are excluded from *coverage only* — they are still analysed
# for bugs, smells and duplication. They are covered, and covered well, by
# tests/integration, which installs the built .oxt and drives the menu commands for real;
# but that code executes inside soffice's own Python interpreter, which coverage.py is not
# running in and cannot instrument from outside. All four therefore report 0.0% while
# actually being exercised, and their 285 lines are the whole of the gap between the pure
# core's ~98% and the 58.9% the project reports.
#
# The split is not arbitrary: the core (table, network, times, layout, diagram) imports no
# UNO at all — a test asserts it — and everything that touches the drawing API lives in
# these four. That is the same line the project's own README draws.
#
# This narrows what the quality gate can see, so it is listed with every other exclusion in
# gortazar/aideas → ideas/quality-gate/exclusions.md.
sonar.coverage.exclusions=src/lopert/commands.py,src/lopert/dialogs.py,src/lopert/documents.py,src/lopert/drawing.py
