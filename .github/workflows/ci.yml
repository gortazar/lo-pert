name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core tests and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # Unit tests (including the hypothesis properties) and a check that the built
      # .oxt actually contains the files an extension needs. Neither pulls
      # LibreOffice in, so this job is fast and gates every push.
      - run: nix flake check --print-build-logs

  headless:
    name: headless LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # Installs the built .oxt with unopkg into a throwaway profile, drives the
      # menu commands over the UNO bridge and reads the drawn page back. Slower —
      # the dev shell brings in LibreOffice — and worth it: a manifest mistake is
      # invisible to every other check here.
      - run: nix develop --command pytest tests/integration -q
