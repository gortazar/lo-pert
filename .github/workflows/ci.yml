name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      # All three checks: the pure core's unit tests (hypothesis properties
      # included), the headless tests that install the built .oxt into a throwaway
      # profile and drive the menu commands over the UNO bridge, and an assertion
      # that the packaged archive contains what an extension needs. The middle one
      # is the only thing that catches a manifest or Addons.xcu mistake, which
      # otherwise produces an extension that installs and contributes no menu.
      - run: nix flake check --print-build-logs
